version: "2"

run:
  concurrency: 4
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - prealloc
    - staticcheck
    - unconvert
    - whitespace
  settings:
    dupl:
      threshold: 100
    errcheck:
      exclude-functions:
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    funlen:
      lines: 80
      statements: 40
    goconst:
      min-len: 3
      min-occurrences: 3
      numbers: true
    gocyclo:
      min-complexity: 20
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
      initialisms:
        - ACL
        - API
        - ASCII
        - CPU
        - CSS
        - DNS
        - EOF
        - GUID
        - HTML
        - HTTP
        - HTTPS
        - ID
        - IP
        - JSON
        - QPS
        - RAM
        - RPC
        - SLA
        - SMTP
        - SQL
        - SSH
        - TCP
        - TLS
        - TTL
        - UDP
        - UI
        - GID
        - UID
        - UUID
        - URI
        - URL
        - UTF8
        - VM
        - XML
        - XMPP
        - XSRF
        - XSS
      dot-import-whitelist:
        - fmt
      http-status-code-whitelist:
        - "200"
        - "400"
        - "404"
        - "500"
    whitespace:
      multi-if: true
      multi-func: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - funlen
          - gocognit
          - goconst
          - gocyclo
          - gosec
          - govet
        path: _test\.go
      # These tools intentionally create user-readable reports and generated
      # source files; changing them to 0600 would make normal sharing awkward.
      - linters:
          - gosec
        text: G306
        path: (cmd/testinventory/main\.go|examples/codegen/.*/main\.go)$
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
