name: Build, Test and Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Go 1.27.1 / ${{ matrix.os }} / build-test
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      GODEBUG: gotypesalias=1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.sum

      - name: Root module dependency consistency
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Root module formatting
        shell: bash
        run: |
          go fmt ./...
          git diff --exit-code -- '*.go'

      - name: Root module vet
        run: go vet ./...

      - name: Root module tests
        run: go test -count=1 ./...

      - name: Nested integration module tests
        shell: bash
        run: |
          cd internal/integration
          go mod download
          go test -count=1 ./...

      - name: Unit-test gap assessment
        shell: bash
        run: GODEBUG=gotypesalias=1 scripts/assess-test-gaps.sh

      - name: Consumer integration scenarios
        shell: bash
        run: GODEBUG=gotypesalias=1 scripts/test-integration.sh all

      - name: Documentation and Pages artifact validation
        shell: bash
        run: GODEBUG=gotypesalias=1 scripts/verify-docs.sh

  golangci-lint:
    name: Go 1.27.1 / ubuntu-latest / lint
    runs-on: ubuntu-latest
    env:
      GODEBUG: gotypesalias=1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: ./...
